<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lattice Configuration</title>
    <style>
      :root {
        --bg: #ffffff;
        --text: #1d1d26;
      }
      [data-theme='dark'] {
        --bg: #1d1d26;
