<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Lattice Graph</title>
    <!-- 关键 CSS：防止 FOUC，global.less 加载前生效（主题实际值由宿主在启动后注入） -->
    <style>
      :root {
        --bg: #ffffff;
        --text: #1d1d26;
      }
      [data-theme='dark'] {
        --bg: #1d1d26;
        --text: #e8e8e8;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { height: 100%; width: 100%; overflow: hidden; }
      /* 详情视图（侧栏 WebviewView，普通文档流内容）：恢复文档级滚动，
         否则内容超出被 overflow:hidden 裁掉且无滚动条（工作台模式由 AppShell 内部控制滚动）。 */
      html[data-lattice-view='detail'],
      html[data-lattice-view='detail'] body,
      html[data-lattice-view='detail'] #root {
        height: auto;
        overflow: visible;
      }
      html[data-lattice-view='detail'] {
        overflow-x: hidden;
        overflow-y: auto;
        background: var(--bg);
      }
      body {
        background: var(--bg);
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
