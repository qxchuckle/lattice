name: Site

on:
  push:
    branches: [master]
    paths:
      - 'apps/site/**'
      - 'docs/**'
      - 'i18n-manifest.json'
      - 'scripts/install-content.mjs'
      - 'scripts/verify-install-publication.mjs'
      - 'scripts/cli-distribution/config.cjs'
      - 'scripts/installation-channels.json'
      - 'scripts/sync-install-docs.mjs'
      - 'scripts/__tests__/install-content.test.mjs'
      - 'scripts/__tests__/verify-install-publication.test.mjs'
      - 'README*.md'
      - 'packages/cli/README*.md'
      - 'packages/web-ui/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'apps/site/**'
      - 'docs/**'
      - 'i18n-manifest.json'
      - 'scripts/install-content.mjs'
      - 'scripts/verify-install-publication.mjs'
      - 'scripts/cli-distribution/config.cjs'
      - 'scripts/installation-channels.json'
      - 'scripts/sync-install-docs.mjs'
      - 'scripts/__tests__/install-content.test.mjs'
      - 'scripts/__tests__/verify-install-publication.test.mjs'
      - 'README*.md'
      - 'packages/cli/README*.md'
      - 'packages/web-ui/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  SITE_URL: https://lattice.qcqx.cn
  # CI builds and tests at the project sub-path; the deploy artifact is rebuilt at the domain root.
  SITE_BASE: /lattice

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: installation catalog gate and injection tests
        run: pnpm check:install
      - name: docs i18n gate
        run: pnpm check:docs-i18n
      - name: docs sync gate and unit tests
        run: pnpm check:docs
      - name: check types
        run: pnpm check:site
      - name: build site
        run: pnpm build:site
      - name: gate self-test
        run: pnpm selftest:site-gates
      - name: install chromium
        run: pnpm --filter @qcqx/lattice-site exec playwright install --with-deps chromium
      - name: test site
        run: pnpm --filter @qcqx/lattice-site test:e2e
      - name: build site for custom domain
        run: pnpm build:site
        env:
          SITE_BASE: /
      - name: test installation and docs at custom-domain root
        run: pnpm --filter @qcqx/lattice-site exec playwright test install.spec.ts docs.spec.ts
        env:
          SITE_BASE: /
      - name: verify public installation channels
        if: github.event_name != 'pull_request'
        run: node scripts/verify-install-publication.mjs
      - name: configure pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: upload pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/site/dist

  deploy:
    name: deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v5
