name: Release

# tag 推送后自动发布 GitHub Release：
# - 正文取自 CHANGELOG.md 对应版本段（scripts/release-notes.mjs）
# - 附件是从同一个 tag 构建的 VSIX（不是本地工作树的产物）
# npm 包与两个扩展市场的发布仍在本地完成（见 CONTRIBUTING.md → Releasing）。
on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write
  actions: read # 等 CI 结果需要读 workflow run

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: 20

jobs:
  release:
    name: release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整历史才能判断 tag 是否在 master 上
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: check release scripts
        run: pnpm check:release

      # 只允许给 master 上的提交发版，避免把分支试验的 tag 发出去
      - name: tag must point at a commit on master
        run: |
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/master; then
            echo "::error::$GITHUB_SHA 不在 master 上，拒绝发版"
            exit 1
          fi

      # 堵住“CI 红了照样发版”：等该提交的 CI 结论，未出结果就轮询，红/取消即失败
      - name: wait for CI to pass on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="$GITHUB_SHA"
          for i in $(seq 1 40); do
            STATE=$(gh run list --workflow=ci.yml --commit "$SHA" --event push --limit 1 \
              --json status,conclusion \
              --jq 'if length == 0 then "none" else .[0] | if .status == "completed" then (if .conclusion == "success" then "ok" else "fail:" + (.conclusion // "unknown") end) else "running" end end')
            echo "CI: $STATE（第 $i 次）"
            case "$STATE" in
              ok) echo "CI 已通过"; exit 0 ;;
              fail:*) echo "::error::该提交的 CI 未通过（$STATE），先修 CI 再发版"; exit 1 ;;
              *) sleep 20 ;;
            esac
          done
          echo "::error::等待 CI 超时：未找到 $SHA 的 CI 运行或一直未完成"
          exit 1

      # tag 至少要能对上 core/cli/web 中的一个版本：都不匹配说明 tag 打错了；
      # 只匹配到一部分是局部发布（release.mjs --core/--cli/--web），仅告警
      - name: verify tag matches package versions
        run: |
          TAG="${{ github.ref_name }}"
          CORE=$(node -p "require('./packages/core/package.json').version")
          CLI=$(node -p "require('./packages/cli/package.json').version")
          WEB=$(node -p "require('./packages/web/package.json').version")
          echo "tag=$TAG core=$CORE cli=$CLI web=$WEB"
          MATCHED=0
          [ "v$CORE" = "$TAG" ] && MATCHED=$((MATCHED+1))
          [ "v$CLI" = "$TAG" ] && MATCHED=$((MATCHED+1))
          [ "v$WEB" = "$TAG" ] && MATCHED=$((MATCHED+1))
          if [ "$MATCHED" -eq 0 ]; then
            echo "::error::tag $TAG 与 core/cli/web 版本都不匹配（core=$CORE cli=$CLI web=$WEB）"
            exit 1
          fi
          if [ "$MATCHED" -lt 3 ]; then
            echo "::warning::局部发布：只有 $MATCHED/3 个包是 $TAG"
          fi

      # 按目录过滤，不依赖扩展包名（改过名：lattice → lattice-context）
      - name: build vsix from tag
        run: pnpm --dir packages/vscode run package

      - name: locate vsix
        id: vsix
        run: |
          NAME=$(node -p "require('./packages/vscode/package.json').name")
          EXT=$(node -p "require('./packages/vscode/package.json').version")
          FILE="packages/vscode/dist-vsix/${NAME}-${EXT}.vsix"
          if [ ! -f "$FILE" ]; then
            echo "::error::未找到 $FILE"
            ls -la packages/vscode/dist-vsix 2>/dev/null || true
            exit 1
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$FILE")" >> "$GITHUB_OUTPUT"
          echo "ext=$EXT" >> "$GITHUB_OUTPUT"

      - name: write release notes
        run: >-
          node scripts/release-notes.mjs "${{ github.ref_name }}" --out .release-notes.md --asset "${{ steps.vsix.outputs.file }}"


      # 幂等：已存在就改正文，不存在才创建；附件始终覆盖，便于重跑
      - name: create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file .release-notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file .release-notes.md --verify-tag
          fi
          gh release upload "$TAG" "${{ steps.vsix.outputs.file }}" --clobber

      - name: summarize
        run: |
          {
            echo "### Release ${{ github.ref_name }}"
            echo ""
            echo "- 正文：CHANGELOG.md 的 \`[${{ github.ref_name }}]\` 段"
            echo "- 附件：\`${{ steps.vsix.outputs.name }}\`（扩展 ${{ steps.vsix.outputs.ext }}，由该 tag 构建）"
            echo "- 页面：https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          } >> "$GITHUB_STEP_SUMMARY"
