name: Feature request
description: Suggest an idea or improvement
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow pain point, not just the solution. Real scenarios help a lot.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to see. If it touches several surfaces (CLI / extension / web), say which one matters most.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: surface
    attributes:
      label: Primary surface
      options:
        - VS Code extension
        - CLI (lattice / ltc)
        - Web workbench
        - Core / services / API
        - Docs / templates
    validations:
      required: true
